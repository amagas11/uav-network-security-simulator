[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-swarm-security-sim"
version = "7.0.0"
description = "Deterministic UAV swarm network attack and defense simulation platform"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "numpy>=1.26",
  "pydantic>=2.6",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
uav-sim = "tools.run_experiment:main"
uav-sim-validate = "tools.validate_dataset:main"
uav-sim-migrate-dataset = "tools.migrate_dataset:main"

[tool.setuptools.packages.find]
include = [
  "app*",
  "attack*",
  "Detector*",
  "Manager*",
  "network*",
  "NRChannel*",
  "swarm_sim*",
  "tools*",
  "UAVNode*",
]
exclude = ["无人机*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
